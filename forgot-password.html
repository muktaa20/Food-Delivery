<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Reset password · Foodie</title>
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css"
    integrity="sha512-DxV+EoADOkOygM4IR9yXP8Sb2qwgidEmeqAEmDKIOfPRQZOWbXCzLC6vjbZyy0vPisbH2SyW27+ddLVCN+OMzQ=="
    crossorigin="anonymous"
    referrerpolicy="no-referrer"
  />
  <link rel="stylesheet" href="style.css" />
  <script type="module" src="js/main.js"></script>
</head>
<body data-page="forgot">
  <header id="site-header"></header>

  <main class="auth-page">
    <div class="auth-shell">
      <section class="auth-panel">
        <h1 class="auth-title" id="forgot-title">Forgot your password?</h1>
        <p class="auth-sub" id="forgot-sub" aria-live="polite">Enter your username or email and we'll give you a reset code.</p>

        <form id="forgot-form" class="auth-form" novalidate>
          <div class="form-row">
            <label for="fp-identifier">Username or email</label>
            <input id="fp-identifier" name="identifier" autocomplete="username" autocapitalize="none" spellcheck="false" required aria-describedby="fp-identifier-err" />
            <p class="field-error" id="fp-identifier-err" data-error-for="identifier"></p>
          </div>
          <button class="btn btn-primary btn-block" type="submit" disabled>Continue</button>
        </form>

        <form id="code-form" class="auth-form" novalidate hidden>
          <div class="demo-code" role="status">
            <span>Demo mode: no email is sent. Your code is</span>
            <strong id="demo-code"></strong>
            <small>Valid for <span id="demo-minutes"></span> minutes.</small>
          </div>
          <div class="form-row">
            <label for="fp-code">6-digit code</label>
            <input id="fp-code" class="code-input" name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" required aria-describedby="fp-code-err" />
            <p class="field-error" id="fp-code-err" data-error-for="code"></p>
          </div>
          <button class="btn btn-primary btn-block" type="submit" disabled>Verify code</button>
          <button class="btn btn-block" type="button" id="resend-code">Get a new code</button>
        </form>

        <form id="new-password-form" class="auth-form" novalidate hidden>
          <div class="form-row">
            <label for="fp-password">New password</label>
            <div class="input-group">
              <input id="fp-password" name="password" type="password" autocomplete="new-password" required aria-describedby="fp-password-err" />
              <button type="button" class="input-icon-btn" data-toggle-password="password" aria-label="Show password" aria-pressed="false"><i class="fa-regular fa-eye" aria-hidden="true"></i></button>
            </div>
            <div class="password-meter" id="password-meter" data-score=""><i></i><i></i><i></i><i></i><span aria-live="polite"></span></div>
            <p class="field-error" id="fp-password-err" data-error-for="password"></p>
          </div>
          <div class="form-row">
            <label for="fp-confirm">Confirm new password</label>
            <div class="input-group">
              <input id="fp-confirm" name="confirm" type="password" autocomplete="new-password" required aria-describedby="fp-confirm-err" />
              <button type="button" class="input-icon-btn" data-toggle-password="confirm" aria-label="Show password" aria-pressed="false"><i class="fa-regular fa-eye" aria-hidden="true"></i></button>
            </div>
            <p class="field-error" id="fp-confirm-err" data-error-for="confirm"></p>
          </div>
          <button class="btn btn-primary btn-block" type="submit" disabled>Update password</button>
        </form>

        <p class="auth-switch">Remembered it? <a href="login.html" data-auth-switch>Back to sign in</a></p>
      </section>
      <aside class="auth-aside" aria-hidden="true">
        <img src="https://images.unsplash.com/photo-1504674900247-0877df9cc836?auto=format&fit=crop&w=1000&h=1300&q=85" alt="" />
        <div class="auth-aside-copy">
          <p class="auth-quote">“The food arrived hot and fresh, and the delivery was super quick.”</p>
          <p class="auth-quote-by">Bharat · Foodie customer</p>
        </div>
      </aside>
    </div>
  </main>

  <footer id="site-footer" class="site-footer"></footer>
</body>
</html>
