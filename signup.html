<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Signup - Foodie</title>
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css"
    integrity="sha512-DxV+EoADOkOygM4IR9yXP8Sb2qwgidEmeqAEmDKIOfPRQZOWbXCzLC6vjbZyy0vPisbH2SyW27+ddLVCN+OMzQ=="
    crossorigin="anonymous"
    referrerpolicy="no-referrer"
  />
  <link rel="stylesheet" href="style.css" />
  <script type="module" src="js/main.js"></script>
</head>
<body data-page="signup">
  <header id="site-header"></header>

  <main>
    <section>
      <div class="wraper p-top text-center">
        <h2>Sign Up</h2>
        <form id="signup-form" class="auth-form">
          <div class="form-row">
            <label for="su-name">Full name</label>
            <input id="su-name" name="name" autocomplete="name" required />
          </div>
          <div class="form-row">
            <label for="su-username">Username</label>
            <input id="su-username" name="username" autocomplete="username" required />
          </div>
          <div class="form-row">
            <label for="su-email">Email</label>
            <input id="su-email" name="email" type="email" autocomplete="email" required />
          </div>
          <div class="form-row">
            <label for="su-password">Password</label>
            <input id="su-password" name="password" type="password" autocomplete="new-password" required />
          </div>
          <div class="form-row">
            <button class="btn" type="submit">Create account</button>
          </div>
          <p class="small">Already have an account? <a href="login.html">Login</a></p>
          <div id="signup-error" class="error-msg"></div>
        </form>
      </div>
    </section>
  </main>

  <footer id="site-footer" class="site-footer"></footer>
</body>
</html>
