<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login - Foodie</title>
  <link rel="stylesheet" href="style.css" />
  <script defer src="script.js"></script>
</head>
<body>
  <header>
    <nav class="navbar flex between wraper">
      <a href="index.html" class="logo">Foodie.</a>
      <div class="desktop-action flex gap-2">
        <a href="cart.html" class="cart-icon">
          <i class="fa-solid fa-bag-shopping"></i>
          <span class="cart-value">0</span>
        </a>
        <a href="signup.html" class="btn">Sign up</a>
      </div>
    </nav>
  </header>

  <main>
    <section>
      <div class="wraper p-top text-center">
        <h2>Login</h2>
        <form id="login-form" class="auth-form">
          <div class="form-row">
            <label for="login-username">Username or Email</label>
            <input id="login-username" name="username" required />
          </div>
          <div class="form-row">
            <label for="login-password">Password</label>
            <input id="login-password" type="password" name="password" required />
          </div>
          <div class="form-row">
            <button class="btn" type="submit">Login</button>
          </div>
          <p class="small">Don't have an account? <a href="signup.html">Sign up</a></p>
          <div id="login-error" class="error-msg"></div>
        </form>
      </div>
    </section>
  </main>
</body>
</html>
