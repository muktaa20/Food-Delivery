<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Menu - Foodie</title>
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css"
    integrity="sha512-DxV+EoADOkOygM4IR9yXP8Sb2qwgidEmeqAEmDKIOfPRQZOWbXCzLC6vjbZyy0vPisbH2SyW27+ddLVCN+OMzQ=="
    crossorigin="anonymous"
    referrerpolicy="no-referrer"
  />
  <link rel="stylesheet" href="style.css" />
  <script type="module" src="js/main.js"></script>
</head>
<body data-page="menu">
  <header id="site-header"></header>

  <main>
    <section>
      <div class="wraper p-top">
        <div class="text-center">
          <h5>Menu</h5>
          <h2>Explore our dishes</h2>
        </div>

        <div class="filters text-center mt-4">
          <button class="btn filter-btn" data-cat="all">All</button>
          <button class="btn filter-btn" data-cat="pizza">Pizza</button>
          <button class="btn filter-btn" data-cat="burger">Burger</button>
          <button class="btn filter-btn" data-cat="noodles">Noodles</button>
        </div>

        <div class="card-list grid mt-4" id="menu-grid">
          <!-- JS will render menu items here -->
        </div>
      </div>
    </section>
  </main>

  <footer id="site-footer" class="site-footer"></footer>
</body>
</html>
