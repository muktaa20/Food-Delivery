<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Checkout - Foodie</title>
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css"
    integrity="sha512-DxV+EoADOkOygM4IR9yXP8Sb2qwgidEmeqAEmDKIOfPRQZOWbXCzLC6vjbZyy0vPisbH2SyW27+ddLVCN+OMzQ=="
    crossorigin="anonymous"
    referrerpolicy="no-referrer"
  />
  <link rel="stylesheet" href="style.css" />
  <script type="module" src="js/main.js"></script>
</head>
<body data-page="checkout">
  <header id="site-header"></header>

  <main>
    <section>
      <div class="wraper p-top">
        <div class="text-center">
          <h2>Checkout</h2>
        </div>

        <div class="checkout-grid mt-4">
          <div class="checkout-left">
            <form id="checkout-form">
              <div class="form-row">
                <label for="c-name">Full name</label>
                <input id="c-name" name="name" required />
              </div>
              <div class="form-row">
                <label for="c-phone">Phone</label>
                <input id="c-phone" name="phone" type="tel" required />
              </div>
              <div class="form-row">
                <label for="c-address">Address</label>
                <textarea id="c-address" name="address" rows="4" required></textarea>
              </div>
              <div class="form-row">
                <!-- Enabled by JS once the submit handler is attached. -->
                <button class="btn" type="submit" disabled>Place Order</button>
              </div>
            </form>
            <div id="checkout-msg" class="error-msg"></div>
          </div>

          <div class="checkout-right" id="checkout-summary">
            <!-- order summary injected here -->
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer id="site-footer" class="site-footer"></footer>
</body>
</html>
